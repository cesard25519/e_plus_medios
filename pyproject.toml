[project]
name = "e-plus-medios"
version = "0.1.0"
description = "Ejercicio para la vacante de Ingeniero(a) de Operaciones y Plataforma (DevOps / Python) de E+ Medios."
readme = "README.md"
authors = [
    { name = "cesar", email = "cesard25519@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
e-plus-medios = "e_plus_medios:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
